              }

              private String cfgSecret() {
                  android.widget.EditText e = (android.widget.EditText) findViewById(R.id.editSecret);
                  String v = (e == null) ? "" : e.getText().toString().trim();
                  if (v.length() > 0) { prefs().edit().putString("secret", v).apply(); }
                  return v;
