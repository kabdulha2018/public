                          android:textAllCaps="false" />

                      <Button android:id="@+id/btnSlotSpeed" android:layout_width="match_parent"
                          android:layout_height="wrap_content" android:minHeight="46dp"
                          android:layout_marginTop="4dp" android:onClick="onBnSlotSpeed"
                          android:text="วัดความเร็วตรวจช่อง (1,000 ช่อง)" android:textSize="14sp"
                          android:textAllCaps="false" />

                      <Button android:id="@+id/btnSdkInfo" android:layout_width="match_parent"
