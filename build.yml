          # 3) เพิ่มเมธอดปุ่มคัดลอก + showTemplate ก่อนปีกกาปิดคลาส (บรรทัดสุดท้าย)
          python3 - "$M" << 'PYEOF'
          import sys, io
          p = sys.argv[1]
          src = io.open(p, encoding='utf-8', errors='replace').read()
          methods = """
              // ===== v2: ปุ่มคัดลอก template =====


              // ===== v5: คุยกับเซิร์ฟเวอร์ PC =====
              private android.content.SharedPreferences prefs() {
                  return getSharedPreferences("zkcfg", MODE_PRIVATE);
              }

              private String cfgHost() {
                  android.widget.AutoCompleteTextView e =
                      (android.widget.AutoCompleteTextView) findViewById(R.id.editHost);
                  String v = (e == null) ? "" : e.getText().toString().trim();
                  if (v.length() > 0) { rememberHost(v); }   // v9.2: เก็บลงรายการเดียวกับที่อ่านกลับ
