              // ===== v6: ทดสอบ convertTemplate ว่าแปลงเป็น ISO ได้ไหม =====
              private String hex8(byte[] b, int len) {
                  StringBuilder sb = new StringBuilder();
                  int n = Math.min(8, Math.min(len, b.length));
                  for (int i = 0; i < n; i++) {
                      sb.append(String.format("%02x ", b[i]));
                  }
                  return sb.toString().trim();
              }

              private String guessFormat(byte[] b) {
                  if (b == null || b.length < 4) { return "?"; }
                  if ((b[0] & 0xFF) == 0x46 && (b[1] & 0xFF) == 0x4D
                      && (b[2] & 0xFF) == 0x52 && (b[3] & 0xFF) == 0x00) {
                      return "ISO/ANSI มาตรฐาน (FMR)";
                  }
                  if ((b[0] & 0xFF) == 0x9a || (b[0] & 0xFF) == 0x9b) {
                      return "ZK เฉพาะยี่ห้อ";
                  }
                  return "ไม่รู้จัก";
              }

              // ===== v22: Lazy check ช่องสแกน =====
              /** ช่องนี้ว่างจริงไหม (ถาม SDK) - คืน 1=มีข้อมูล 0=ว่าง -1=ตรวจไม่ได้ */
              private int slotUsed(int sid) {
                  if (!scannerOn) { return -1; }
                  try {
                      byte[] buf = new byte[2048];
                      int r = ZKFingerService.get(buf, String.valueOf(sid));
                      if (r < 0) { return -1; }          // ค่าติดลบ = error ไม่ใช่ว่าง
                      return (r > 0) ? 1 : 0;
                  } catch (Throwable t) {
                      return -1;
                  }
              }

              /** วัดความเร็ว get() จริงบนเครื่องนี้ */
              public void onBnSlotSpeed(View view) {
                  if (!scannerOn) { setResult("กด Start เปิดเครื่องสแกนก่อน"); return; }
                  setResult("กำลังวัด...");
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              byte[] buf = new byte[2048];
                              long t0 = System.currentTimeMillis();
                              int n = 1000;
                              for (int i = 1; i <= n; i++) {
                                  ZKFingerService.get(buf, String.valueOf(i));
                              }
                              long ms = System.currentTimeMillis() - t0;
                              double per = (double) ms / n;
                              long all = (long) (per * 100000 / 1000);
                              setResult("วัดความเร็วตรวจช่องสแกน\\n"
                                      + n + " ช่อง = " + ms + " ms"
                                      + "\\nเฉลี่ย " + String.format("%.3f", per) + " ms/ช่อง"
                                      + "\\nถ้าตรวจครบ 100,000 ช่อง ประมาณ " + all + " วินาที");
                          } catch (Throwable t) {
                              setResult("วัดไม่สำเร็จ: " + t.getMessage());
                          }
                      }
                  }).start();
              }

              // ---- สแกนช่องทั้งหมด (เครื่องมือซ่อม) ----
              private volatile boolean scanStop = false;

              public void onBnSlotScan(View view) {
                  if (!scannerOn) { setResult("กด Start เปิดเครื่องสแกนก่อน"); return; }
                  if (scanning) { scanStop = true; setResult("กำลังหยุด..."); return; }
                  final String host = cfgHost();
                  if (host.length() == 0) { setResult("ใส่ที่อยู่ PC ก่อน"); return; }
                  final String pin = cfgPin();
                  final String sec = cfgSecret();
                  scanning = true;
                  scanStop = false;
                  setSlotScanText("หยุดสแกน");
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              org.json.JSONObject o = new org.json.JSONObject();
                              o.put("pin", pin);
                              o.put("secret", sec);
                              o.put("dev", "phone");
                              String body = httpPost(host, "/slots", o.toString());
                              org.json.JSONObject j = new org.json.JSONObject(body);
                              if (!j.optBoolean("ok", false)) {
                                  setResult("ขอแผนที่ช่องไม่ได้: " + j.optString("err", body));
                                  return;
                              }
                              org.json.JSONObject used = j.optJSONObject("used");
                              int mx = j.optInt("max", 100000);
                              byte[] buf = new byte[2048];
                              java.util.List<Integer> ghost = new java.util.ArrayList<Integer>();
                              java.util.List<Integer> missing = new java.util.ArrayList<Integer>();
                              int found = 0;
                              long t0 = System.currentTimeMillis();
                              for (int i = 1; i <= mx; i++) {
                                  if (scanStop) { break; }
                                  int r;
                                  try {
                                      r = ZKFingerService.get(buf, String.valueOf(i));
                                  } catch (Throwable t) {
                                      r = -1;
                                  }
                                  boolean here = (r > 0);
                                  boolean there = (used != null && used.has(String.valueOf(i)));
                                  if (here) { found++; }
                                  if (here && !there && ghost.size() < 50) { ghost.add(i); }
                                  if (!here && there && missing.size() < 50) { missing.add(i); }
                                  if (i % 500 == 0) {
                                      long el = (System.currentTimeMillis() - t0) / 1000;
                                      setResult("กำลังสแกน " + i + " / " + mx
                                              + "\\nพบข้อมูล " + found + " ช่อง · " + el + " วินาที"
                                              + "\\n(กดปุ่มอีกครั้งเพื่อหยุด)");
                                  }
                              }
                              long el = (System.currentTimeMillis() - t0) / 1000;
                              StringBuilder sb = new StringBuilder();
                              sb.append(scanStop ? "หยุดสแกนแล้ว" : "สแกนเสร็จ");
                              sb.append(" (").append(el).append(" วินาที)");
                              sb.append("\\nในเครื่องสแกน: ").append(found).append(" ช่อง");
                              sb.append("\\nใน PC: ").append(used == null ? 0 : used.length()).append(" ช่อง");
                              if (ghost.isEmpty() && missing.isEmpty()) {
                                  sb.append("\\n\\nตรงกันทั้งหมด");
                              } else {
                                  if (!ghost.isEmpty()) {
                                      sb.append("\\n\\nขยะค้างในเครื่อง (PC ไม่รู้จัก): ").append(ghost);
                                      sb.append("\\nกำลังแจ้ง PC ...");
                                      for (int k = 0; k < ghost.size(); k++) {
                                          try {
                                              org.json.JSONObject m = new org.json.JSONObject();
                                              m.put("pin", pin);
                                              m.put("secret", sec);
                                              m.put("dev", "phone");
                                              m.put("sid", ghost.get(k));
                                              m.put("why", "สแกนพบในเครื่องสแกน แต่ PC ไม่รู้จัก");
                                              httpPost(host, "/slotmark", m.toString());
                                          } catch (Exception ex) { }
                                      }
                                      sb.append(" แจ้งแล้ว");
                                  }
                                  if (!missing.isEmpty()) {
                                      sb.append("\\n\\nPC มีแต่เครื่องไม่มี: ").append(missing);
                                      sb.append("\\nกด ล้างแล้วโหลดใหม่ทั้งหมด เพื่อซ่อม");
                                  }
                              }
                              setResult(sb.toString());
                          } catch (Exception e) {
                              setResult("สแกนไม่สำเร็จ: " + e.getMessage());
                          } finally {
                              scanning = false;
                              scanStop = false;
                              setSlotScanText("สแกนช่องสแกนทั้งหมด");
                          }
                      }
                  }).start();
              }

