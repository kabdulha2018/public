              // ===== v9.2: ที่อยู่ PC แบบมีรายการ 10 ค่าล่าสุด (แยกตามโหมด) =====
              private String slotKey() {
                  return prefs().getBoolean("outside", false) ? "hosts_out" : "hosts_in";
              }

              private java.util.List<String> hostList() {
                  java.util.List<String> out = new java.util.ArrayList<String>();
                  String raw = prefs().getString(slotKey(), "");
                  if (raw != null && raw.length() > 0) {
                      String[] a = raw.split("\\n");
                      for (int i = 0; i < a.length; i++) {
                          String v = a[i].trim();
                          if (v.length() > 0 && !out.contains(v)) { out.add(v); }
                      }
                  }
                  // กู้ค่าเก่าจากเวอร์ชันก่อน (จะได้ไม่ต้องพิมพ์ใหม่)
                  if (out.isEmpty()) {
                      String[] old = { prefs().getString("host", ""),
                                       prefs().getString("host_in", ""),
                                       prefs().getString("host_out", "") };
                      for (int i = 0; i < old.length; i++) {
                          if (old[i] != null && old[i].length() > 0 && !out.contains(old[i])) { out.add(old[i]); }
                      }
                  }
                  return out;
              }

              /** ดันที่อยู่ที่ใช้ล่าสุดขึ้นบนสุด เก็บไม่เกิน 10 */
              private void rememberHost(String v) {
                  if (v == null || v.trim().length() == 0) { return; }
                  v = v.trim();
                  java.util.List<String> l = hostList();
                  l.remove(v);
                  l.add(0, v);
                  while (l.size() > 10) { l.remove(l.size() - 1); }
                  StringBuilder sb = new StringBuilder();
                  for (int i = 0; i < l.size(); i++) {
                      if (i > 0) { sb.append("\\n"); }
                      sb.append(l.get(i));
                  }
                  prefs().edit().putString(slotKey(), sb.toString()).apply();
                  fillHostDropdown();
              }

              private void fillHostDropdown() {
                  try {
                      android.widget.AutoCompleteTextView e =
                          (android.widget.AutoCompleteTextView) findViewById(R.id.editHost);
                      if (e == null) { return; }
                      java.util.List<String> l = hostList();
                      android.widget.ArrayAdapter<String> ad = new android.widget.ArrayAdapter<String>(
                          this, android.R.layout.simple_dropdown_item_1line, l);
                      e.setAdapter(ad);
                      e.setThreshold(0);
                  } catch (Throwable t) {
                      android.util.Log.e(TAG, "dropdown", t);
                  }
              }

              private void applyHostSlot() {
                  android.widget.AutoCompleteTextView e =
                      (android.widget.AutoCompleteTextView) findViewById(R.id.editHost);
                  if (e == null) { return; }
                  java.util.List<String> l = hostList();
                  e.setText(l.isEmpty() ? "" : l.get(0));
                  fillHostDropdown();
                  boolean out = prefs().getBoolean("outside", false);
                  android.widget.TextView t = (android.widget.TextView) findViewById(R.id.txtWhere);
                  if (t != null) {
                      t.setText(out ? "กำลังใช้: นอกคลินิก(เน็ต)" : "กำลังใช้: ในคลินิก(wifi)");
                  }
              }

              public void onBnHere(View view) {
                  prefs().edit().putBoolean("outside", false).apply();
                  applyHostSlot();
                  setResult("สลับเป็น ในคลินิก(wifi)");
              }

              public void onBnAway(View view) {
                  prefs().edit().putBoolean("outside", true).apply();
                  applyHostSlot();
                  setResult("สลับเป็น นอกคลินิก(เน็ต)");
              }

              /** ยิง HTTP แบบรอผล - ต้องเรียกจาก thread แยกเท่านั้น */
              private String httpPost(String host, String path, String json) throws Exception {
                  java.net.HttpURLConnection c = null;
                  try {
                      java.net.URL u = new java.net.URL("http://" + host + path);
                      c = (java.net.HttpURLConnection) u.openConnection();
                      c.setConnectTimeout(6000);
                      c.setReadTimeout(60000);
                      c.setRequestMethod("POST");
                      c.setRequestProperty("Content-Type", "application/json; charset=utf-8");
                      c.setDoOutput(true);
                      java.io.OutputStream os = c.getOutputStream();
                      os.write(json.getBytes("UTF-8"));
                      os.flush();
                      os.close();
                      int code = c.getResponseCode();
                      java.io.InputStream is = (code >= 400) ? c.getErrorStream() : c.getInputStream();
                      java.io.ByteArrayOutputStream bo = new java.io.ByteArrayOutputStream();
                      byte[] buf = new byte[8192];
                      int n;
                      while ((n = is.read(buf)) > 0) { bo.write(buf, 0, n); }
                      is.close();
                      return new String(bo.toByteArray(), "UTF-8");
                  } finally {
                      if (c != null) { try { c.disconnect(); } catch (Exception ig) { } }
                  }
              }

              /** ยิง HTTP ใน thread แยก แล้วส่งผลกลับผ่าน setResult (ห่อ UI ให้แล้ว) */
              private void httpAsync(final String path, final String jsonBody, final boolean isPost) {
                  final String host = cfgHost();
                  if (host.length() == 0) { setResult("ใส่ IP ของ PC ก่อน เช่น 192.168.15.2:8080"); return; }
                  setResult("กำลังติดต่อ " + host + " ...");
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          String out;
                          java.net.HttpURLConnection c = null;
                          try {
                              java.net.URL u = new java.net.URL("http://" + host + path);
                              c = (java.net.HttpURLConnection) u.openConnection();
                              c.setConnectTimeout(5000);
                              c.setReadTimeout(20000);
                              if (isPost) {
                                  c.setRequestMethod("POST");
                                  c.setRequestProperty("Content-Type", "application/json; charset=utf-8");
                                  c.setDoOutput(true);
                                  java.io.OutputStream os = c.getOutputStream();
                                  os.write(jsonBody.getBytes("UTF-8"));
                                  os.flush();
                                  os.close();
                              }
                              int code = c.getResponseCode();
                              java.io.InputStream is = (code >= 400) ? c.getErrorStream() : c.getInputStream();
                              java.io.ByteArrayOutputStream bo = new java.io.ByteArrayOutputStream();
                              byte[] buf = new byte[4096];
                              int n;
                              while ((n = is.read(buf)) > 0) { bo.write(buf, 0, n); }
                              is.close();
                              out = prettyResult(new String(bo.toByteArray(), "UTF-8"));
                          } catch (Exception e) {
                              out = "ต่อไม่ได้: " + e.getMessage()
                                  + "\\n(เช็คว่าเปิด zk_server.py อยู่ / อยู่ WiFi เดียวกัน / IP ถูก)";
                          } finally {
                              if (c != null) { try { c.disconnect(); } catch (Exception ig) { } }
                          }
                          setResult(out);
                          if (path.startsWith("/enroll")) {
                              sending = false;
                              if (out != null && !out.startsWith("ไม่สำเร็จ") && !out.startsWith("ต่อไม่ได้")) {
                                  readyToSend = false;
                                  lastTemplateB64 = null;
                              }
                              updateScanButtons();
                          }
                      }
                  }).start();
              }

              /** แปลง JSON จากเซิร์ฟเวอร์ให้อ่านง่าย */
              private String prettyResult(String body) {
                  try {
                      org.json.JSONObject j = new org.json.JSONObject(body);
                      if (!j.optBoolean("ok", false)) {
                          return "ไม่สำเร็จ: " + j.optString("err", body);
                      }
                      if (j.has("patients")) {
                          return "เชื่อมต่อได้\\nคนไข้ " + j.optInt("patients")
                               + " คน · ลายนิ้วมือ " + j.optInt("fingers") + " รายการ\\n"
                               + (j.optBoolean("identify_ready") ? "ค้นลายนิ้วมือ: พร้อม" : "ค้นลายนิ้วมือ: ยังไม่พร้อม");
                      }
                      if (j.has("found")) {
                          if (!j.optBoolean("found")) { return "ไม่พบคนไข้ (" + j.optInt("ms") + " ms)"; }
                          org.json.JSONObject p = j.optJSONObject("patient");
                          if (p == null) { return "เจอ แต่ไม่มีข้อมูลคนไข้"; }
                          return "พบ: " + p.optString("name") + " " + p.optString("surname")
                               + "\\nเลขคนไข้ " + p.optString("number") + " · อายุ " + p.optString("age")
                               + "\\nที่อยู่ " + p.optString("address")
                               + "\\n(score " + j.optInt("score") + " · " + j.optInt("ms") + " ms)";
                      }
                      if (j.has("total")) {
                          org.json.JSONObject p = j.optJSONObject("patient");
                          StringBuilder sb = new StringBuilder("เก็บแล้ว: ");
                          sb.append(p == null ? "" : p.optString("name") + " " + p.optString("surname"));
                          org.json.JSONArray hv = j.optJSONArray("have");
                          org.json.JSONArray nd = j.optJSONArray("need");
                          if (hv != null && hv.length() > 0) {
                              sb.append("\\nนิ้วที่มี: ").append(joinArr(hv, "", ""));
                          }
                          if (nd != null && nd.length() > 0) {
                              sb.append("\\nยังขาด: ").append(joinArr(nd, "", ""));
                              sb.append("  <- เลือกนิ้วนั้นแล้ว Register ต่อ");
                          } else if (hv != null && hv.length() > 0) {
                              sb.append("  (ครบแล้ว)");
                          }
                          sb.append("\\nรวมทั้งหมด " + j.optInt("total") + " นิ้ว");
                          return sb.toString();
                      }
                      if (j.has("rows")) {
                          org.json.JSONArray a = j.optJSONArray("rows");
                          StringBuilder sb = new StringBuilder("พบ " + j.optInt("n") + " ราย\\n");
                          for (int i = 0; i < Math.min(8, a.length()); i++) {
                              org.json.JSONObject p = a.getJSONObject(i);
                              sb.append(p.optInt("rid")).append(") ").append(p.optString("name"))
                                .append(" ").append(p.optString("surname")).append("\\n");
                          }
                          return sb.toString();
                      }
                      return body;
                  } catch (Exception e) {
                      return body;
                  }
              }

              /** ทดสอบเชื่อมต่อ + ตรวจรหัสจริง (แก้ปัญหาเข้าใจผิดว่าต่อได้แปลว่ารหัสถูก) */
              public void onBnPing(View view) {
                  final String host = cfgHost();
                  if (host.length() == 0) { setResult("ใส่ที่อยู่ PC ก่อน"); return; }
                  final String pin = cfgPin();
                  final String sec = cfgSecret();
                  if (pin.length() == 0 || sec.length() == 0) {
                      setResult("ใส่ SECRET และ PIN ก่อน"); return;
                  }
                  setResult("กำลังตรวจ...");
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              org.json.JSONObject o = new org.json.JSONObject();
                              o.put("pin", pin);
                              o.put("secret", sec);
                              o.put("dev", "phone");
                              String body = httpPost(host, "/hello", o.toString());
                              org.json.JSONObject j = new org.json.JSONObject(body);
                              if (!j.optBoolean("ok", false)) {
                                  meName = ""; meRole = "";
                                  setResult("ต่อเครื่องได้ แต่รหัสไม่ผ่าน\\n" + j.optString("err", body)
                                          + "\\n(ตรวจ SECRET และ PIN ให้ตรงกับที่ตั้งไว้)");
                                  setStatus("ยังไม่ได้เข้าใช้");
                                  return;
                              }
                              meName = j.optString("name", "");
                              meRole = j.optString("role", "");
                              org.json.JSONArray fs = j.optJSONArray("fingers_per_person");
                              StringBuilder fl = new StringBuilder();
                              if (fs != null) {
                                  for (int i = 0; i < fs.length(); i++) {
                                      if (i > 0) { fl.append("+"); }
                                      fl.append(fs.getString(i));
                                  }
                              }
                              setResult("เชื่อมต่อได้ · เข้าใช้เป็น " + meName + " (" + meRole + ")"
                                      + "\\nคนไข้ " + j.optInt("patients") + " คน"
                                      + " · ลายนิ้วมือ " + j.optInt("fingers") + " นิ้ว"
                                      + (j.optInt("queue") > 0 ? "\\nมีคิวรอเขียน dbf " + j.optInt("queue") + " รายการ" : "")
                                      + (fl.length() > 0 ? "\\nเก็บนิ้ว: " + fl : ""));
                              setStatus("เข้าใช้: " + meName + " (" + meRole + ")");
                          } catch (Exception e) {
                              meName = ""; meRole = "";
                              setResult("ต่อไม่ได้: " + e.getMessage()
                                      + "\\n(เช็คว่าเปิด zk_server.py อยู่ / อยู่ WiFi เดียวกัน / ที่อยู่ถูก)");
                              setStatus("ต่อ PC ไม่ได้");
                          }
                      }
                  }).start();
              }

