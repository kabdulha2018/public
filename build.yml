                          android:textAllCaps="false" />

                      <Button android:id="@+id/btnReloadFp" android:layout_width="match_parent"
                          android:layout_height="wrap_content" android:minHeight="46dp"
                          android:layout_marginTop="4dp" android:onClick="onBnReloadFp"
