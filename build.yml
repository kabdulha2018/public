              /** ข้อความบนสุดกะพริบเบาๆ เมื่อเครื่องออฟไลน์ */
              private void setBlink(boolean on) {
                  try {
                      if (blinker != null) { blinker.cancel(); blinker = null; }
                      android.widget.TextView t =
                          (android.widget.TextView) findViewById(R.id.txtResult);
                      if (t == null) { return; }
                      if (!on) { t.setAlpha(1f); return; }
                      blinker = android.animation.ObjectAnimator.ofFloat(t, "alpha", 1f, 0.25f);
                      blinker.setDuration(700);
                      blinker.setRepeatCount(android.animation.ObjectAnimator.INFINITE);
                      blinker.setRepeatMode(android.animation.ObjectAnimator.REVERSE);
                      blinker.start();
                  } catch (Throwable t) { }
              }

