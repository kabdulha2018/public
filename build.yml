                  </LinearLayout>

              </LinearLayout>
          </ScrollView>
          EOF

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          cd proj
          gradle assembleRelease --stacktrace --no-daemon

      - name: Show output
        if: always()
        run: find proj -name '*.apk' -exec ls -lh {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zkfinger-apk
          path: proj/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
