              private void remoteIdentify(byte[] tpl) {
                  try {
                      String b64 = Base64.encodeToString(tpl, 0, tpl.length, Base64.NO_WRAP);
                      org.json.JSONObject o = new org.json.JSONObject();
                      o.put("pin", cfgPin());
