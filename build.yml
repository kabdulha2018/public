              // ===== v30: ซิงค์ลายนิ้วมือให้ตรงกับ PC อัตโนมัติ =====
              private boolean syncing = false;

              /**
               * หลังเปิดเครื่องสแกน (init เสร็จ) - เทียบจำนวนกับ PC
               * ไม่ตรง = ล้างแล้วโหลดใหม่ให้เอง (ผู้ใช้ไม่ต้องเข้าตั้งค่าเอง)
               */
              private void autoSyncFp() {
                  if (syncing) { return; }
                  final String host = cfgHost();
                  if (host.length() == 0) { return; }
                  final String pin = cfgPin();
                  final String sec = cfgSecret();
                  if (pin.length() == 0 || sec.length() == 0) { return; }
                  syncing = true;
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              Thread.sleep(600);          // รอ SDK พร้อมจริง
                              int here = countSafe();
                              org.json.JSONObject o = new org.json.JSONObject();
                              o.put("pin", pin);
                              o.put("secret", sec);
                              o.put("dev", "phone");
                              String body = httpPost(host, "/hello", o.toString());
                              org.json.JSONObject j = new org.json.JSONObject(body);
                              if (!j.optBoolean("ok", false)) { return; }
                              int there = j.optInt("fingers", -1);
                              if (there < 0) { return; }
                              if (here == there) {
                                  setResult("ลายนิ้วมือตรงกับ PC แล้ว (" + here + " นิ้ว)"
                                          + "\\nพร้อมค้นคนไข้");
                                  return;
                              }
                              setResult("กำลังซิงค์ลายนิ้วมือจาก PC ("
                                      + (here < 0 ? "?" : String.valueOf(here)) + " -> " + there + ") ...");
                              try { ZKFingerService.clear(); } catch (Throwable t) { }
                              try {
                                  java.io.File f = cacheFile();
                                  if (f.exists()) { f.delete(); }
                              } catch (Throwable t) { }
                              loadedCount = 0;
                              runOnUiThread(new Runnable() {
                                  @Override
                                  public void run() { onBnLoadFp(null); }
                              });
                          } catch (Exception e) {
                              setResult("ซิงค์ลายนิ้วมือไม่สำเร็จ: " + e.getMessage());
                          } finally {
                              syncing = false;
                          }
                      }
                  }).start();
              }

