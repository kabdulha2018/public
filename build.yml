              // ===== v8: โหลด template จาก PC + เทียบในมือถือ =====
              private java.io.File cacheFile() {
                  return new java.io.File(getFilesDir(), "fp_cache.json");
              }

              /** อ่าน cache จาก ROM แล้วใส่เข้า SDK (เรียกตอนเปิดแอป) */
              private int loadCacheIntoSdk() {
                  int n = 0;
                  try {
                      java.io.File f = cacheFile();
                      if (!f.exists()) { return 0; }
                      java.io.FileInputStream in = new java.io.FileInputStream(f);
                      java.io.ByteArrayOutputStream bo = new java.io.ByteArrayOutputStream();
                      byte[] buf = new byte[8192];
                      int k;
                      while ((k = in.read(buf)) > 0) { bo.write(buf, 0, k); }
                      in.close();
                      org.json.JSONObject j = new org.json.JSONObject(new String(bo.toByteArray(), "UTF-8"));
                      org.json.JSONObject m = j.getJSONObject("fp");
                      java.util.Iterator<String> it = m.keys();
                      while (it.hasNext()) {
                          String rid = it.next();
                          byte[] t = Base64.decode(m.getString(rid), Base64.NO_WRAP);
                          if (ZKFingerService.save(t, rid) == 0) { n++; }
                      }
                  } catch (Throwable t) {
                      android.util.Log.e(TAG, "loadCache", t);
                  }
                  loadedCount = n;
                  return n;
              }

              private double cacheSince() {
                  try {
                      java.io.File f = cacheFile();
                      if (!f.exists()) { return 0; }
                      java.io.FileInputStream in = new java.io.FileInputStream(f);
                      java.io.ByteArrayOutputStream bo = new java.io.ByteArrayOutputStream();
                      byte[] buf = new byte[8192];
                      int k;
                      while ((k = in.read(buf)) > 0) { bo.write(buf, 0, k); }
                      in.close();
                      return new org.json.JSONObject(new String(bo.toByteArray(), "UTF-8")).optDouble("since", 0);
                  } catch (Throwable t) { return 0; }
              }

              /** รวมของใหม่เข้า cache แล้วเขียนกลับ ROM */
              private void mergeCache(org.json.JSONArray rows, double now) {
                  try {
                      org.json.JSONObject m = new org.json.JSONObject();
                      java.io.File f = cacheFile();
                      if (f.exists()) {
                          java.io.FileInputStream in = new java.io.FileInputStream(f);
                          java.io.ByteArrayOutputStream bo = new java.io.ByteArrayOutputStream();
                          byte[] b2 = new byte[8192];
                          int k;
                          while ((k = in.read(b2)) > 0) { bo.write(b2, 0, k); }
                          in.close();
                          m = new org.json.JSONObject(new String(bo.toByteArray(), "UTF-8")).optJSONObject("fp");
                          if (m == null) { m = new org.json.JSONObject(); }
                      }
                      for (int i = 0; i < rows.length(); i++) {
                          org.json.JSONObject r = rows.getJSONObject(i);
                          m.put(String.valueOf(r.getInt("sid")), r.getString("t"));
                      }
                      org.json.JSONObject out = new org.json.JSONObject();
                      out.put("fp", m);
                      out.put("since", now);
                      java.io.FileOutputStream os = new java.io.FileOutputStream(f);
                      os.write(out.toString().getBytes("UTF-8"));
                      os.close();
                  } catch (Throwable t) {
                      android.util.Log.e(TAG, "mergeCache", t);
                  }
              }

              public void onBnLoadFp(View view) {
                  final String host = cfgHost();
                  if (host.length() == 0) { setResult("ใส่ที่อยู่ PC ก่อน"); return; }
                  final String pin = cfgPin();
                  final String sec = cfgSecret();
                  setResult("กำลังโหลดลายนิ้วมือจาก PC ...");
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              double since = cacheSince();
                              org.json.JSONObject o = new org.json.JSONObject();
                              o.put("pin", pin);
                              o.put("secret", sec);
                              o.put("dev", "phone");
                              o.put("since", since);
                              String body = httpPost(host, "/templates", o.toString());
                              org.json.JSONObject j = new org.json.JSONObject(body);
                              if (!j.optBoolean("ok", false)) {
                                  setResult("โหลดไม่สำเร็จ: " + j.optString("err", body));
                                  return;
                              }
                              org.json.JSONArray rows = j.optJSONArray("rows");
                              double now = j.optDouble("now", since);
                              if (rows == null) { rows = new org.json.JSONArray(); }
                              int added = 0;
                              for (int i = 0; i < rows.length(); i++) {
                                  org.json.JSONObject r = rows.getJSONObject(i);
                                  byte[] t = Base64.decode(r.getString("t"), Base64.NO_WRAP);
                                  if (ZKFingerService.save(t, String.valueOf(r.getInt("sid"))) == 0) { added++; }
                                  if (i % 200 == 0 && i > 0) {
                                      setResult("กำลังใส่ " + i + "/" + rows.length() + " ...");
                                  }
                              }
                              mergeCache(rows, now);
                              loadedCount += added;
                              int here = countSafe();
                              int there = j.optInt("total");
                              String warn2 = "";
                              if (here < 0) {
                                  warn2 = "\\n** เครื่องสแกนยังไม่พร้อม - กด Start ก่อน **";
                              } else if (here != there && !autoFixing) {
                                  autoFixing = true;
                                  setResult("ข้อมูลไม่ตรงกับ PC (" + here + " vs " + there
                                          + ") - กำลังล้างแล้วโหลดใหม่...");
                                  runOnUiThread(new Runnable() {
                                      @Override
                                      public void run() { onBnReloadFp(null); }
                                  });
                                  return;
                              }
                              autoFixing = false;
                              setResult("โหลดเสร็จ\\nได้ใหม่ " + added + " รายการ"
                                      + "\\nในเครื่องตอนนี้ " + here + " รายการ"
                                      + "\\n(PC มีทั้งหมด " + there + ")" + warn2);
                          } catch (Exception e) {
                              setResult("โหลดไม่สำเร็จ: " + e.getMessage());
                          }
                      }
                  }).start();
              }

              public void onBnFindPatient(View view) {
                  if (!bStarted) { setResult("กด Start ก่อน"); return; }
                  if (cfgHost().length() == 0) { setResult("ใส่ที่อยู่ PC ก่อน"); return; }
                  bRegister = false;
                  bRemote = false;
                  bFind = true;
                  setResult("แตะนิ้ว 1 ครั้ง เพื่อค้นคนไข้");
              }

              /** เทียบในมือถือเอง แล้วถาม PC ว่าเป็นใคร */
              private void findPatient(final byte[] tpl) {
                  final String host = cfgHost();
                  final String pin = cfgPin();
                  final String sec = cfgSecret();
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              long t0 = System.currentTimeMillis();
                              byte[] bufids = new byte[256];
                              int ret = ZKFingerService.identify(tpl, bufids, 70, 1);
                              long ms = System.currentTimeMillis() - t0;
                              if (ret <= 0) {
                                  setResult("ไม่พบคนไข้ (" + ms + " ms)"
                                          + "\\nในเครื่องมี " + countText());
                                  return;
                              }
                              String[] parts = new String(bufids).split("\\t");
                              String sidStr = parts[0].trim();
                              if (sidStr.contains("_")) { sidStr = sidStr.substring(0, sidStr.indexOf("_")); }
                              String score = (parts.length > 1) ? parts[1].trim() : "?";
                              org.json.JSONObject o = new org.json.JSONObject();
                              o.put("pin", pin);
                              o.put("secret", sec);
                              o.put("dev", "phone");
                              o.put("sid", Integer.parseInt(sidStr));
                              String body = httpPost(host, "/patient", o.toString());
                              org.json.JSONObject j = new org.json.JSONObject(body);
                              if (!j.optBoolean("ok", false)) {
                                  setResult("เจอช่อง " + sidStr + " แต่ถาม PC ไม่ได้: " + j.optString("err"));
                                  return;
                              }
                              if (!j.optBoolean("found", false)) {
                                  setResult("ข้อมูลในเครื่องไม่ตรงกับ PC - กำลังซิงค์ใหม่...");
                                  autoSyncFp();
                                  return;
                              }
                              org.json.JSONObject p = j.getJSONObject("patient");
                              StringBuilder sb = new StringBuilder();
                              sb.append("ชื่อ      : ").append(p.optString("name"))
                                .append(" ").append(p.optString("surname"));
                              sb.append("\\nเลขคนไข้  : ").append(p.optString("number"));
                              sb.append("\\nอายุ      : ").append(p.optString("age"));
                              sb.append("\\nที่อยู่    : ").append(p.optString("address"));
                              
                              org.json.JSONArray hv2 = j.optJSONArray("have");
                              if (hv2 != null && hv2.length() > 0) {
                                  sb.append("\\nนิ้วที่เก็บ: ").append(joinArr(hv2, "", ""));
                              }
                              sb.append("\\n———————————————");
                              sb.append("\\nคะแนน ").append(score).append(" · ").append(ms).append(" ms");
                              String w = j.optString("warn", "");
                              if (w.length() > 0) { sb.append("\\n** ").append(w).append(" **"); }
                              setResult(sb.toString());
                          } catch (Exception e) {
                              setResult("ค้นไม่สำเร็จ: " + e.getMessage());
                          }
                      }
                  }).start();
              }

              public void onBnOpenWeb(View view) {
                  String host = cfgHost();
                  if (host.length() == 0) { setResult("ใส่ที่อยู่ PC ก่อน"); return; }
                  try {
                      android.content.Intent it = new android.content.Intent(
                          android.content.Intent.ACTION_VIEW, android.net.Uri.parse("http://" + host + "/"));
                      startActivity(it);
                  } catch (Exception e) {
                      setResult("เปิดเว็บไม่ได้: " + e.getMessage());
                  }
              }

