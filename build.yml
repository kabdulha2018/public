              /** ตรวจกับ PC ว่า PIN นี้เป็น admin จริงไหม */
              private void checkAdmin(final String pin) {
                  if (pin.length() == 0) { setResult("ใส่ PIN ก่อน"); return; }
                  final String host = cfgHostQuiet();
                  final String sec = cfgSecretQuiet();
                  if (host.length() == 0 || sec.length() == 0) {
                      // ยังไม่เคยตั้งค่าเครื่อง - ให้เข้าได้เพื่อตั้งครั้งแรก
                      showSec(3);
                      setResult("ยังไม่ได้ตั้งค่าเครื่อง - ตั้งค่าครั้งแรกได้เลย");
                      return;
                  }
                  setResult("กำลังตรวจสิทธิ์...");
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              org.json.JSONObject o = new org.json.JSONObject();
                              o.put("pin", pin);
                              o.put("secret", sec);
                              o.put("dev", "phone");
                              String body = httpPost(host, "/hello", o.toString());
                              org.json.JSONObject j = new org.json.JSONObject(body);
                              if (!j.optBoolean("ok", false)) {
                                  setResult("เข้าไม่ได้: " + j.optString("err", body));
                                  return;
                              }
                              if (!"admin".equals(j.optString("role"))) {
                                  setResult("หน้าตั้งค่าเปิดได้เฉพาะ admin"
                                          + "\\nคุณคือ " + j.optString("name")
                                          + " (" + j.optString("role") + ")");
                                  return;
                              }
                              runOnUiThread(new Runnable() {
                                  @Override
                                  public void run() {
                                      showSec(3);
                                      setResult("เข้าหน้าตั้งค่าเป็น admin");
                                  }
                              });
                          } catch (Exception e) {
                              setResult("ตรวจสิทธิ์ไม่ได้: " + e.getMessage());
                          }
                      }
                  }).start();
              }

