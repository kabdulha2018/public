              /** ดรอปดาวน์เลขคนไข้ - จำ 5 เลขล่าสุด */
              private void rememberHn(String v) {
                  if (v == null || v.trim().length() == 0) { return; }
                  v = v.trim();
                  java.util.List<String> l = hnList();
                  l.remove(v);
                  l.add(0, v);
                  while (l.size() > 5) { l.remove(l.size() - 1); }
                  StringBuilder sb = new StringBuilder();
                  for (int i = 0; i < l.size(); i++) {
                      if (i > 0) { sb.append("\\n"); }
                      sb.append(l.get(i));
                  }
                  prefs().edit().putString("hns", sb.toString()).apply();
              }

              private java.util.List<String> hnList() {
                  java.util.List<String> out = new java.util.ArrayList<String>();
                  String raw = prefs().getString("hns", "");
                  if (raw != null && raw.length() > 0) {
                      String[] a = raw.split("\\n");
                      for (int i = 0; i < a.length; i++) {
                          String v = a[i].trim();
                          if (v.length() > 0 && !out.contains(v)) { out.add(v); }
                      }
                  }
                  return out;
              }

