              // ===== v15: หน้าใส่ PIN =====
              /** เข้าใช้งานด้วย PIN (ตรวจกับ PC จริง) */
              public void onBnLogin(View view) {
                  final String pin = txt(R.id.loginPin);
                  if (pin.length() == 0) { setLoginMsg("ใส่ PIN ก่อน"); return; }
                  final String sec = cfgSecret();
                  final String wk = cfgWorker();
                  if (sec.length() == 0) {
                      setLoginMsg("ยังไม่ได้ตั้งค่าเครื่อง - แตะ ตั้งค่าเครื่อง ด้านล่าง");
                      return;
                  }
                  setLoginMsg("กำลังตรวจ...");
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          String who = "", role = "", via = "";

                          // ชั้น 1: ถาม worker (ใช้ได้แม้ PC ปิด)
                          if (wk.length() > 0) {
                              try {
                                  String u = "https://" + wk + "/appwho?secret="
                                           + java.net.URLEncoder.encode(sec, "UTF-8")
                                           + "&pin=" + java.net.URLEncoder.encode(pin, "UTF-8");
                                  String b = httpGet(u);
                                  org.json.JSONObject j = new org.json.JSONObject(b);
                                  if (j.optBoolean("ok", false)) {
                                      who = j.optString("name", "");
                                      role = j.optString("role", "");
                                      via = "worker";
                                  } else if (b.contains("PIN")) {
                                      setLoginMsg("PIN ไม่ถูกต้อง");
                                      return;
                                  }
                              } catch (Exception e) { }
                          }

                          // ชั้น 2: ถาม PC
                          if (who.length() == 0) {
                              String host = cfgHost();
                              if (host.length() > 0) {
                                  try {
                                      org.json.JSONObject o = new org.json.JSONObject();
                                      o.put("pin", pin);
                                      o.put("secret", sec);
                                      o.put("dev", "phone");
                                      String b = httpPost(host, "/hello", o.toString());
                                      org.json.JSONObject j = new org.json.JSONObject(b);
                                      if (j.optBoolean("ok", false)) {
                                          who = j.optString("name", "");
                                          role = j.optString("role", "");
                                          via = "PC";
                                      }
                                  } catch (Exception e) { }
                              }
                          }

                          if (who.length() == 0) {
                              setLoginMsg("เข้าใช้งานไม่ได้\\nต่อทั้งอินเทอร์เน็ตและ PC ไม่ได้"
                                        + "\\nตรวจ Tailscale / WiFi แล้วลองใหม่");
                              return;
                          }

                          meName = who;
                          meRole = role;
                          prefs().edit().putString("pin", pin).apply();
                          setTxtSafe(R.id.editPin, pin);
                          final String w2 = who, r2 = role, v2 = via;
                          runOnUiThread(new Runnable() {
                              @Override
                              public void run() {
                                  setLoginMsg("");
                                  setTxt(R.id.loginPin, "");
                                  showSec(0);
                                  setStatus("เข้าใช้: " + w2 + " (" + r2 + ")");
                                  View sv = findViewById(R.id.mS);
                                  if (sv != null) {
                                      sv.setVisibility("admin".equals(r2) ? View.VISIBLE : View.GONE);
                                  }
                                  setResult("ยินดีต้อนรับ " + w2 + "  [ตรวจผ่าน " + v2 + "]");
                                  setLoginMsg("");     // ล้างข้อความผิดพลาดเก่า
                              }
                          });
                          findHost();     // หาที่อยู่ PC ที่ต่อได้ (ในคลินิก/นอกคลินิก)
                      }
                  }).start();
              }

              /** ดึงข้อมูลแบบ GET (ใช้กับ worker) */
              private String httpGet(String u) throws Exception {
                  java.net.HttpURLConnection c =
                      (java.net.HttpURLConnection) new java.net.URL(u).openConnection();
                  c.setConnectTimeout(8000);
                  c.setReadTimeout(8000);
                  c.setRequestProperty("User-Agent", "Mozilla/5.0 (Android) ZKClinic");
                  java.io.InputStream is = (c.getResponseCode() < 400)
                      ? c.getInputStream() : c.getErrorStream();
                  java.io.ByteArrayOutputStream bo = new java.io.ByteArrayOutputStream();
                  byte[] buf = new byte[4096];
                  int n;
                  while ((n = is.read(buf)) > 0) { bo.write(buf, 0, n); }
                  is.close();
                  c.disconnect();
                  return bo.toString("UTF-8");
              }

              /**
               * หาที่อยู่ PC ที่ต่อได้จริง - ลองของโหมดปัจจุบันก่อน
               * ถ้าไม่ได้ ลองอีกโหมดให้อัตโนมัติ (พนักงานไม่ต้องกดสลับเอง)
               */
              private void findHost() {
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              if (pingHost(cfgHost())) { return; }        // ที่อยู่ปัจจุบันใช้ได้
                              boolean out = prefs().getBoolean("outside", false);
                              java.util.List<String> other = hostListOf(!out);
                              for (int i = 0; i < other.size(); i++) {
                                  final String h = other.get(i);
                                  if (pingHost(h)) {
                                      prefs().edit().putBoolean("outside", !out).apply();
                                      rememberHost(h);
                                      runOnUiThread(new Runnable() {
                                          @Override
                                          public void run() {
                                              applyHostSlot();
                                              setResult("สลับที่อยู่ PC อัตโนมัติ -> " + h
                                                      + "\\n(" + (out ? "ในคลินิก" : "นอกคลินิก") + ")");
                                          }
                                      });
                                      return;
                                  }
                              }
                              setResult("ต่อ PC ไม่ได้ทั้งในคลินิกและนอกคลินิก"
                                      + "\\nตรวจ WiFi / Tailscale แล้วลองใหม่");
                          } catch (Throwable t) { }
                      }
                  }).start();
              }

              private boolean pingHost(String h) {
                  if (h == null || h.trim().length() == 0) { return false; }
                  try {
                      String b = httpGet("http://" + h.trim() + "/ping");
                      return new org.json.JSONObject(b).optBoolean("ok", false);
                  } catch (Exception e) {
                      return false;
                  }
              }

              /** รายการที่อยู่ของโหมดที่ระบุ (true = นอกคลินิก) */
              private java.util.List<String> hostListOf(boolean outside) {
                  java.util.List<String> out = new java.util.ArrayList<String>();
                  String raw = prefs().getString(outside ? "hosts_out" : "hosts_in", "");
                  if (raw != null && raw.length() > 0) {
                      String[] a = raw.split("\\n");
                      for (int i = 0; i < a.length; i++) {
                          String v = a[i].trim();
                          if (v.length() > 0 && !out.contains(v)) { out.add(v); }
                      }
                  }
                  return out;
              }

