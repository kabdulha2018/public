              // ===== v16: ค้นคนไข้ (ใช้ร่วมกันหลายหน้า) =====
              /**
               * ค้นคนไข้แล้วให้เลือกจากรายการ
               * mode 0 = หน้า B (เติมช่องลำดับ)  |  mode 1 = หน้า D (เติมช่องแก้ไข)
               */
              private void searchPatient(final String nm, final String sur, final int mode) {
                  final String host = cfgHost();
                  if (host.length() == 0) { setResult("ใส่ที่อยู่ PC ในหน้าตั้งค่าก่อน"); return; }
                  if (nm.length() == 0 && sur.length() == 0) { setResult("พิมพ์ชื่อหรือนามสกุลที่จะค้น"); return; }
                  final String pin = cfgPin();
                  final String sec = cfgSecret();
                  setResult("กำลังค้น...");
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              org.json.JSONObject o = new org.json.JSONObject();
                              o.put("pin", pin);
                              o.put("secret", sec);
                              o.put("dev", "phone");
                              if (nm.length() > 0) { o.put("name", nm); }
                              if (sur.length() > 0) { o.put("surname", sur); }
                              String body = httpPost(host, "/search", o.toString());
                              org.json.JSONObject j = new org.json.JSONObject(body);
                              if (!j.optBoolean("ok", false)) {
                                  setResult("ค้นไม่สำเร็จ: " + j.optString("err", body));
                                  return;
                              }
                              final org.json.JSONArray rows = j.optJSONArray("rows");
                              if (rows == null || rows.length() == 0) { setResult("ไม่พบ"); return; }
                              final java.util.List<String> labels = new java.util.ArrayList<String>();
                              for (int i = 0; i < Math.min(30, rows.length()); i++) {
                                  org.json.JSONObject p = rows.getJSONObject(i);
                                  org.json.JSONArray fs = p.optJSONArray("fingers");
                                  StringBuilder fl = new StringBuilder();
                                  if (fs != null && fs.length() > 0) {
                                      fl.append(" [");
                                      for (int k = 0; k < fs.length(); k++) {
                                          if (k > 0) { fl.append("+"); }
                                          fl.append(fs.getString(k));
                                      }
                                      fl.append("]");
                                  }
                                  labels.add(p.optString("name") + " " + p.optString("surname")
                                           + "  (HN " + p.optString("number") + " · อายุ " + p.optString("age") + ")"
                                           + fl);
                              }
                              runOnUiThread(new Runnable() {
                                  @Override
                                  public void run() {
                                      try {
                                          new android.app.AlertDialog.Builder(MainActivity.this)
                                              .setTitle("เลือกคนไข้ (พบ " + rows.length() + ")")
                                              .setItems(labels.toArray(new String[0]),
                                                  new android.content.DialogInterface.OnClickListener() {
                                                      @Override
                                                      public void onClick(android.content.DialogInterface di, int w) {
                                                          try {
                                                              pickPatient(rows.getJSONObject(w), mode);
                                                          } catch (Exception ex) {
                                                              setResult("เลือกไม่สำเร็จ: " + ex.getMessage());
                                                          }
                                                      }
                                                  }).show();
                                      } catch (Throwable t) {
                                          setResult("แสดงรายการไม่ได้: " + t.getMessage());
                                      }
                                  }
                              });
                          } catch (Exception e) {
                              setResult("ค้นไม่สำเร็จ: " + e.getMessage());
                          }
                      }
                  }).start();
              }

              private String fingerText(org.json.JSONObject p) {
                  org.json.JSONArray fs = p.optJSONArray("fingers");
                  if (fs == null || fs.length() == 0) { return "ยังไม่มีลายนิ้วมือ"; }
                  StringBuilder sb = new StringBuilder("มีแล้ว: ");
                  for (int i = 0; i < fs.length(); i++) {
                      if (i > 0) { sb.append("+"); }
                      sb.append(fs.optString(i));
                  }
                  return sb.toString();
              }

              private void pickPatient(org.json.JSONObject p, int mode) {
                  curRid = p.optInt("rid");
                  curUid = p.optString("hn_uid", "");
                  curSid = p.optInt("sid", 0);
                  curWho = p.optString("name") + " " + p.optString("surname");
                  curHn = p.optString("number");
                  if (mode == 1) {
                      editRid = curRid;
                      setTxt(R.id.eName, p.optString("name"));
                      setTxt(R.id.eSur, p.optString("surname"));
                      setTxt(R.id.eAge, p.optString("age"));
                      setTxt(R.id.eAddr, p.optString("address"));
                      setTxt(R.id.eIdc, p.optString("id_card"));
                      setTxt(R.id.eHn, p.optString("number"));
                  }
                  showWho(p);
                  setResult("");
                  resetScanButtons();
                  updateScanButtons();
                  askSid();                     // ขอช่องสแกนจาก PC ทันที
              }

              /** แสดงว่ากำลังทำงานกับใคร ทั้งหน้า B และ D */
              private void showWho(org.json.JSONObject p) {
                  String base = curWho + "  (HN " + p.optString("number") + " · อายุ " + p.optString("age") + ")";
                  String fin = fingerText(p);
                  setTv(R.id.bWho, "เลือกแล้ว: " + base + "\\n" + fin
                                 + (curSid > 0 ? " · ช่องสแกน " + curSid : ""));
                  setTv(R.id.eWho, "กำลังแก้: " + base + " · " + fin);
              }

              private void setTv(int id, String v) {
                  try {
                      android.widget.TextView t = (android.widget.TextView) findViewById(id);
                      if (t != null) { t.setText(v); }
                  } catch (Throwable t) { }
              }

              /** ขอช่องสแกน (scanner_id) จาก PC - แอปไม่ต้องคิดเลขเอง */
              private void askSid() {
                  if (curRid <= 0 && curUid.length() == 0) { return; }
                  final String host = cfgHost();
                  if (host.length() == 0) { return; }
                  final String pin = cfgPin();
                  final String sec = cfgSecret();
                  final int rid = curRid;
                  final String uid = curUid;
                  final String fg = curFinger;
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              org.json.JSONObject o = new org.json.JSONObject();
                              o.put("pin", pin);
                              o.put("secret", sec);
                              o.put("dev", "phone");
                              o.put("rid", rid);
                              o.put("finger", fg);
                              if (uid.length() > 0) { o.put("uid", uid); }
                              String body = httpPost(host, "/sid", o.toString());
                              final org.json.JSONObject j = new org.json.JSONObject(body);
                              if (!j.optBoolean("ok", false)) {
                                  setResult("ขอช่องสแกนไม่ได้: " + j.optString("err", body));
                                  return;
                              }
                              curSid = j.optInt("sid", 0);
                              curUid = j.optString("uid", curUid);
                              // Lazy check: ถ้าเป็นช่องใหม่ ตรวจกับ SDK ว่าว่างจริงไหม
                              if (curSid > 0 && !"เดิม".equals(j.optString("how"))) {
                                  int st = slotUsed(curSid);
                                  if (st == 1) {
                                      final int badSid = curSid;
                                      setResult("ช่อง " + badSid + " ไม่ว่างจริง - กำลังขอช่องใหม่...");
                                      try {
                                          org.json.JSONObject o2 = new org.json.JSONObject();
                                          o2.put("pin", pin);
                                          o2.put("secret", sec);
                                          o2.put("dev", "phone");
                                          o2.put("rid", rid);
                                          o2.put("finger", fg);
                                          if (uid.length() > 0) { o2.put("uid", uid); }
                                          org.json.JSONArray av = new org.json.JSONArray();
                                          av.put(badSid);
                                          o2.put("avoid", av);
                                          String b2 = httpPost(host, "/sid", o2.toString());
                                          org.json.JSONObject j2 = new org.json.JSONObject(b2);
                                          if (j2.optBoolean("ok", false)) {
                                              curSid = j2.optInt("sid", curSid);
                                          }
                                      } catch (Exception ex2) { }
                                  }
                              }
                              final org.json.JSONArray have = j.optJSONArray("have");
                              final org.json.JSONArray need = j.optJSONArray("need");
                              final int used = j.optInt("used");
                              final int mx = j.optInt("max");
                              runOnUiThread(new Runnable() {
                                  @Override
                                  public void run() {
                                      setTxt(R.id.editID, String.valueOf(curSid));
                                      StringBuilder sb = new StringBuilder("เลือกแล้ว: " + curWho);
                                      sb.append("\\nHN ").append(curHn);
                                      sb.append(" · ช่อง").append(fingerName(curFinger))
                                        .append(" = ").append(curSid);
                                      org.json.JSONObject sds = j.optJSONObject("sids");
                                      if (sds != null && sds.length() > 0) {
                                          StringBuilder o2 = new StringBuilder();
                                          java.util.Iterator<String> it2 = sds.keys();
                                          while (it2.hasNext()) {
                                              String k2 = it2.next();
                                              if (o2.length() > 0) { o2.append(" · "); }
                                              o2.append(fingerName(k2)).append("=").append(sds.optInt(k2));
                                          }
                                          sb.append("\\nช่องที่เก็บแล้ว: ").append(o2);
                                      }
                                      sb.append("\\n").append(joinArr(have, "มีแล้ว: ", "ยังไม่มีลายนิ้วมือ"));
                                      if (need != null && need.length() > 0) {
                                          sb.append(" · ").append(joinArr(need, "ยังขาด: ", ""));
                                      }
                                      setTv(R.id.bWho, sb.toString());
                                      setStatus("ช่องสแกนใช้ไป " + used + "/" + mx);
                                      haveFingers.clear();
                                      if (have != null) {
                                          for (int i = 0; i < have.length(); i++) {
                                              haveFingers.add(have.optString(i));
                                          }
                                      }
                                      if (!haveFingers.contains(curFinger)) { unlockedFinger = ""; }
                                      updateFingerRow();
                                      updateScanButtons();
                                  }
                              });
                          } catch (Exception e) {
                              setResult("ขอช่องสแกนไม่ได้: " + e.getMessage());
                          }
                      }
                  }).start();
              }

              private String joinArr(org.json.JSONArray a, String pre, String ifEmpty) {
                  if (a == null || a.length() == 0) { return ifEmpty; }
                  StringBuilder sb = new StringBuilder(pre);
                  for (int i = 0; i < a.length(); i++) {
                      if (i > 0) { sb.append(" + "); }
                      sb.append(fingerName(a.optString(i)));   // แสดงเป็นคำไทย
                  }
                  return sb.toString();
              }

