name: Build ZK Finger APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install archive tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full unrar-free unzip

      - name: Extract ZKFinger SDK (rar or zip, nested ok)
        run: |
          set -e
          echo "=== ไฟล์ในโฟลเดอร์ sdk/ ==="
          ls -l sdk/ || { echo "ERROR: ไม่มีโฟลเดอร์ sdk/"; exit 1; }
          echo "=== ชนิดไฟล์จริง (ดูจากเนื้อใน ไม่ใช่นามสกุล) ==="
          file sdk/* || true

          mkdir -p sdkx

          # เลือกเครื่องมือจาก "ชนิดไฟล์จริง" ไม่ใช่นามสกุล (ไฟล์อาจถูกตั้งชื่อผิด)
          extract() {
            SRC="$1"; DST="$2"
            T=$(file -b "$SRC")
            mkdir -p "$DST"
            case "$T" in
              *"Zip archive"*)
                echo "   ชนิด: ZIP -> unzip"
                unzip -o -q "$SRC" -d "$DST" && return 0
                ;;
              *"RAR archive"*)
                echo "   ชนิด: RAR -> unrar-free"
                unrar-free x "$SRC" "$DST/" > /dev/null && return 0
                ;;
              *"7-zip"*|*"7z archive"*)
                echo "   ชนิด: 7z -> 7z"
                7z x -y -o"$DST" "$SRC" > /dev/null && return 0
                ;;
            esac
            echo "   ชนิดไม่แน่ชัด ($T) -> ลองทุกวิธี"
            unzip -o -q "$SRC" -d "$DST" 2>/dev/null && return 0
            unrar-free x "$SRC" "$DST/" > /dev/null 2>&1 && return 0
            7z x -y -o"$DST" "$SRC" > /dev/null 2>&1 && return 0
            return 1
          }

          ARC=$(ls sdk/* | head -1)
          echo "=== แตกชั้นที่ 1: $ARC ==="
          extract "$ARC" sdkx || { echo "ERROR: แตกไฟล์ไม่ได้ทุกวิธี — ไฟล์อาจเสียหรืออัปไม่ครบ"; exit 1; }

          # ถ้ามีไฟล์บีบอัดซ้อนอยู่ข้างใน (เช่น .rar ที่มี .zip) ให้แตกต่ออีกชั้น
          find sdkx -type f \( -iname '*.zip' -o -iname '*.rar' -o -iname '*.7z' \) > /tmp/nested.txt || true
          while read -r f; do
            [ -z "$f" ] && continue
            echo "=== แตกชั้นที่ 2: $f ==="
            extract "$f" sdkx || echo "   ข้าม (แตกไม่ได้)"
          done < /tmp/nested.txt

          echo "=== โฟลเดอร์ที่ได้ ==="
          find sdkx -maxdepth 3 -type d | head -30

      - name: Copy demo project
        run: |
          set -e
          SRC=$(find sdkx -type d -name 'ZKFinger10Demo_SLKID' | head -1)
          if [ -z "$SRC" ]; then
            echo "ERROR: หาโฟลเดอร์ ZKFinger10Demo_SLKID ไม่เจอ"
            echo "--- ไฟล์ที่แตกได้ทั้งหมด (100 รายการแรก) ---"
            find sdkx | head -100
            exit 1
          fi
          echo "demo project: $SRC"
          mkdir -p proj
          cp -r "$SRC"/. proj/
          rm -rf proj/.gradle proj/.idea proj/build proj/app/build
          rm -rf proj/gradle proj/gradlew proj/gradlew.bat
          rm -rf proj/app/src/test proj/app/src/androidTest
          echo "--- java sources ---"
          find proj/app/src/main/java -name '*.java'
          echo "--- libs ---"
          ls -R proj/app/libs | head -20

      - name: Write settings.gradle
        run: |
          cat > proj/settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ZKFingerDemo"
          include ':app'
          EOF

      - name: Write root build.gradle
        run: |
          cat > proj/build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          tasks.register('clean', Delete) {
              delete rootProject.buildDir
          }
          EOF

      - name: Write gradle.properties
        run: |
          cat > proj/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx3072m
          android.useAndroidX=true
          android.nonTransitiveRClass=false
          android.nonFinalResIds=false
          EOF

      - name: Write app/build.gradle
        run: |
          cat > proj/app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.zkfinger10demo'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.slk20r.zkfinger10demo"
                  minSdk 21
                  targetSdk 30
                  versionCode 34
                  versionName "34"
              }

              signingConfigs {
                  release {
                      storeFile file("../zk.p12")
                      storePassword "zkfinger2026"
                      keyAlias "zkkey"
                      keyPassword "zkfinger2026"
                      storeType "PKCS12"
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.release
                  }
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }

              sourceSets {
                  main {
                      jniLibs.srcDirs = ['libs']
                  }
              }

              packaging {
                  jniLibs {
                      useLegacyPackaging true
                  }
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }

          dependencies {
              implementation fileTree(dir: "libs", include: ["*.jar"])
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.browser:browser:1.7.0'
          }
          EOF

      - name: Decode keystore
        run: |
          base64 -d keystore.b64 > proj/zk.p12
          ls -l proj/zk.p12

      - name: Patch AndroidManifest (portrait + rotate allowed)
        run: |
          M=proj/app/src/main/AndroidManifest.xml
          # AGP 8: package ต้องอยู่ใน namespace เท่านั้น
          sed -i 's/ *package="[^"]*"//' $M
          # เอา landscape ออก -> หมุนจอได้อิสระ
          sed -i 's/android:screenOrientation="landscape"//' $M
          # API 31+ ต้องมี exported
          sed -i 's|<activity android:name=".MainActivity"|<activity android:name=".MainActivity" android:exported="true"|' $M
          # Android 9+ บล็อก http:// -> ต้องอนุญาต ไม่งั้นแอปต่อ PC ไม่ได้
          sed -i 's|<application$|<application android:usesCleartextTraffic="true"|' $M
          # v25: เปลี่ยนชื่อแอปเป็นชื่อคลินิก + เลขเวอร์ชัน
          sed -i 's|android:label="[^"]*"|android:label="คลินิกปัตตานีการแพทย์ (V.34)"|g' $M
          # configChanges กันแอปรีสตาร์ทตอนหมุนจอ (ทำให้ลายนิ้วมือที่สแกนค้างอยู่ไม่หาย)
          sed -i 's/android:configChanges="orientation|keyboardHidden"/android:configChanges="orientation|screenSize|keyboardHidden"/' $M
          cat $M

      - name: Patch USB code for modern Android
        run: |
          U=proj/app/src/main/java/com/example/zkfinger10demo/ZKUSBManager/ZKUSBManager.java
          # Android 12+ : PendingIntent ต้องระบุ MUTABLE (USB ต้องให้ระบบเติม extra ได้)
          sed -i 's|PendingIntent.getBroadcast(mContext, 0, intent, 0)|PendingIntent.getBroadcast(mContext, 0, intent, android.os.Build.VERSION.SDK_INT >= 31 ? PendingIntent.FLAG_MUTABLE : 0)|' $U
          # Android 13+ : registerReceiver ต้องระบุว่ารับ broadcast จากภายนอกไหม
          sed -i 's|mContext.registerReceiver(usbMgrReceiver, filter);|if (android.os.Build.VERSION.SDK_INT >= 33) { mContext.registerReceiver(usbMgrReceiver, filter, Context.RECEIVER_EXPORTED); } else { mContext.registerReceiver(usbMgrReceiver, filter); }|' $U
          echo "--- ผลการแก้ ---"
          grep -n "getBroadcast\|registerReceiver(usbMgrReceiver" $U

      - name: Patch MainActivity - copy template button
        run: |
          M=proj/app/src/main/java/com/example/zkfinger10demo/MainActivity.java

          # 1) ประกาศตัวแปรเก็บ base64 ล่าสุด (แทรกหลังบรรทัด strUid)
          sed -i 's|    private String strUid = null;|    private String strUid = null;\n    private String lastTemplateB64 = null;\n    private boolean bRemote = false;\n    private boolean bFind = false;\n    private String meName = \"\";\n    private String meRole = \"\";\n    private String curFinger = \"R1\";\n    private String curUid = \"\";\n    private int curSid = 0;\n    private int curRid = 0;\n    private String curWho = \"\";\n    private String curHn = \"\";\n    private boolean autoFixing = false;\n    private int loadedCount = 0;\n    private String lastImageB64 = null;\n    private byte[] lastTemplateRaw = null;\n    private String lastConvertedB64 = null;\n    private int lastTemplateLen = 0;|' $M

          # 2) ตอนลงทะเบียนสำเร็จ เก็บ base64 ไว้ + แสดงบนจอ
          sed -i 's|                    dbManager.insertUser(strUid, strFeature);|                    dbManager.insertUser(strUid, strFeature);\n                    lastTemplateB64 = strFeature;\n                    lastTemplateRaw = regTemp;\n                    lastTemplateLen = ret;|' $M

          # 2b) extractOK: ถ้าอยู่โหมดค้นจาก PC ให้ส่งไป PC แทนเทียบในเครื่อง
          python3 - "$M" << 'PYEOF2'
          import sys, io
          p = sys.argv[1]
          s = io.open(p, encoding='utf-8', errors='replace').read()
          old = "                doIdentify(fpTemplate);"
          new = "                if (bFind) { bFind = false; findPatient(fpTemplate); }\n                else if (bRemote) { bRemote = false; remoteIdentify(fpTemplate); }\n                else { doIdentify(fpTemplate); }"
          if old not in s:
              print('ERROR: หา doIdentify ใน extractOK ไม่เจอ'); sys.exit(1)
          s = s.replace(old, new, 1)
          io.open(p, 'w', encoding='utf-8').write(s)
          print('extractOK patched')
          PYEOF2

          # 2b2) เก็บภาพลายนิ้วมือล่าสุด (v8) - ไว้ส่งไปเก็บที่ PC
          python3 - "$M" << 'PYEOF4'
          import sys, io
          p = sys.argv[1]
          s = io.open(p, encoding='utf-8', errors='replace').read()
          old = "        public void captureOK(byte[] fpImage) {"
          new = ("        public void captureOK(byte[] fpImage) {\n"
                 "            try {\n"
                 "                android.graphics.Bitmap bm2 = ToolUtils.renderCroppedGreyScaleBitmap(\n"
                 "                    fpImage, fingerprintSensor.getImageWidth(), fingerprintSensor.getImageHeight());\n"
                 "                java.io.ByteArrayOutputStream bo2 = new java.io.ByteArrayOutputStream();\n"
                 "                bm2.compress(android.graphics.Bitmap.CompressFormat.PNG, 100, bo2);\n"
                 "                lastImageB64 = Base64.encodeToString(bo2.toByteArray(), Base64.NO_WRAP);\n"
                 "            } catch (Throwable t) { }")
          if old not in s:
              print('ERROR: หา captureOK ไม่เจอ'); sys.exit(1)
          s = s.replace(old, new, 1)
          io.open(p, 'w', encoding='utf-8').write(s)
          print('captureOK patched')
          PYEOF4

          # 2c) โหลดค่า IP/PIN ที่จำไว้ ตอนเปิดแอป
          python3 - "$M" << 'PYEOF3'
          import sys, io
          p = sys.argv[1]
          s = io.open(p, encoding='utf-8', errors='replace').read()
          old = 'textView = (TextView)findViewById(R.id.txtResult);'
          new = ('textView = (TextView)findViewById(R.id.txtResult);\n'
                 '        try {\n'
                 '            android.content.SharedPreferences sp = getSharedPreferences("zkcfg", MODE_PRIVATE);\n'

                 '            ((android.widget.EditText) findViewById(R.id.editPin)).setText(sp.getString("pin", ""));\n'
                 '            ((android.widget.EditText) findViewById(R.id.editSecret)).setText(sp.getString("secret", ""));\n'
                 '            ((android.widget.EditText) findViewById(R.id.editWorker)).setText(sp.getString("worker", "hn-ocr.kabdulha2018.workers.dev"));\n'
                 '            applyHostSlot();\n'
                 '            try { ((android.widget.TextView) findViewById(R.id.txtVer)).setText(appVersion()); } catch (Throwable t) { }\n'
                 '            setScanner(false, "เครื่องสแกนออฟไลน์ - กด Start");\n'
                 '            new Thread(new Runnable() { public void run() {\n'
                 '                int n = loadCacheIntoSdk();\n'
                 '                if (n > 0) { setResult("โหลดลายนิ้วมือจากเครื่อง " + n + " รายการ"); }\n'
                 '            } }).start();\n'
                 '            showSec(6);   // v25: ทุกคนต้องใส่ PIN ทุกครั้งที่เปิดแอป\n'
                 '            if (sp.getString("secret", "").length() == 0) {\n'
                 '                View b0 = findViewById(R.id.loginSetup);\n'
                 '                if (b0 != null) { b0.setVisibility(View.VISIBLE); }\n'
                 '            }\n'
                 '        } catch (Throwable t) { }')
          if old not in s:
              print('ERROR: หา txtResult ไม่เจอ'); sys.exit(1)
          s = s.replace(old, new, 1)
          io.open(p, 'w', encoding='utf-8').write(s)
          print('โหลดค่าที่จำไว้ patched')
          PYEOF3

          # 2h) v26: แสดงภาพลายนิ้วมือทั้งหน้า B และหน้า F
          python3 - "$M" << 'PYEOF9'
          import sys, io
          p = sys.argv[1]
          s = io.open(p, encoding='utf-8', errors='replace').read()
          old = 'imageView.setImageBitmap(bitmap);'
          new = ('imageView.setImageBitmap(bitmap);\n'
                 '                    try {\n'
                 '                        int[] more = { R.id.imageFP2, R.id.imageFP3 };\n'
                 '                        for (int q = 0; q < more.length; q++) {\n'
                 '                            android.widget.ImageView iq =\n'
                 '                                (android.widget.ImageView) findViewById(more[q]);\n'
                 '                            if (iq != null) { iq.setImageBitmap(bitmap); }\n'
                 '                        }\n'
                 '                    } catch (Throwable t) { }')
          n = s.count(old)
          if n == 0:
              print('WARN: หา setImageBitmap ไม่เจอ')
          else:
              s = s.replace(old, new)
              io.open(p, 'w', encoding='utf-8').write(s)
              print('ภาพลายนิ้วมือ 2 หน้า patched (' + str(n) + ' จุด)')
          PYEOF9

          # 2g) v19: สถานะเครื่องสแกน (ไอคอน + pop up)
          python3 - "$M" << 'PYEOF8'
          import sys, io
          p = sys.argv[1]
          s = io.open(p, encoding='utf-8', errors='replace').read()
          ok = 0

          # ต่อเครื่องไม่ได้
          old = 'textView.setText("connect failed!");'
          new = ('setScanner(false, "เครื่องสแกนออฟไลน์");\n'
                 '            alertScanner("ต่อเครื่องสแกนไม่ได้\\n\\n'
                 '1. ตรวจสาย OTG / USB ว่าเสียบแน่น\\n'
                 '2. ถอดแล้วเสียบใหม่\\n'
                 '3. กด Start อีกครั้ง");')
          if old in s:
              s = s.replace(old, new, 1); ok += 1

          # เปิดเครื่องสำเร็จ (ใช้บริบทถัดไปกันชนกับบรรทัดประกาศตัวแปร)
          old2 = 'bStarted = true;\n            textView.setText("connect success!");'
          new2 = ('bStarted = true;\n'
                  '            setScanner(true, "เครื่องสแกนพร้อม");\n'
                  '            textView.setText("เครื่องสแกนพร้อมใช้งาน");\n'
                  '            autoSyncFp();')
          if old2 in s:
              s = s.replace(old2, new2, 1); ok += 1
          else:
              print('WARN: หา bStarted=true (connect success) ไม่เจอ')

          # ปิดเครื่อง (อยู่ในบล็อก catch - มี } ปิดตามหลัง)
          old3 = 'bStarted = false;\n        }\n    }'
          new3 = ('bStarted = false;\n'
                  '            setScanner(false, "ปิดเครื่องสแกนแล้ว");\n'
                  '        }\n    }')
          if old3 in s:
              s = s.replace(old3, new3, 1); ok += 1
          else:
              print('WARN: หา bStarted=false (ในเมธอด) ไม่เจอ')

          # เครื่องหลุดกลางทาง
          old4 = 'public void onDeviceException() {'
          new4 = ('public void onDeviceException() {\n'
                  '            setScanner(false, "เครื่องสแกนหลุด");\n'
                  '            setResult("เครื่องสแกนหลุด - เสียบสายใหม่แล้วกด Start");\n'
                  '            alertScanner("เครื่องสแกนหลุดการเชื่อมต่อ\\n\\n'
                  'เสียบสายใหม่แล้วกด Start อีกครั้ง");')
          if old4 in s:
              s = s.replace(old4, new4, 1); ok += 1

          io.open(p, 'w', encoding='utf-8').write(s)
          print('สถานะเครื่องสแกน patched (' + str(ok) + '/4)')
          if ok < 4:
              print('WARN: patch สถานะเครื่องไม่ครบ')
          PYEOF8

          # 2f) v18: ตัวนับแตะนิ้ว 0/3 + ปรับสถานะปุ่ม
          python3 - "$M" << 'PYEOF7'
          import sys, io
          p = sys.argv[1]
          s = io.open(p, encoding='utf-8', errors='replace').read()

          # ตอนแตะผ่านแต่ละครั้ง -> อัปเดตตัวนับ
          old = 'setResult("enroll succ");'
          new = ('enrollDone = 3;\n'
                 '                    readyToSend = true;\n'
                 '                    bRegister = false;\n'
                 '                    updateScanButtons();\n'
                 '                    setResult("เก็บ" + fingerName(curFinger) + "ครบ 3 ครั้งแล้ว - กดปุ่มเก็บที่ PC");')
          if old in s:
              s = s.replace(old, new, 1)
          else:
              print('WARN: หา enroll-success ไม่เจอ')

          # นับครั้งที่แตะผ่าน
          old2 = 'enroll_index++;'
          new2 = 'enroll_index++;\n            enrollDone = enroll_index;\n            updateScanButtons();'
          if old2 in s:
              s = s.replace(old2, new2)
          else:
              print('WARN: หา enroll_index++ ไม่เจอ')

          # กด Register -> เริ่มนับใหม่
          old3 = 'public void onBnRegister(View view)'
          i = s.find(old3)
          if i > 0:
              j = s.find('{', i) + 1
              s = s[:j] + ('\n        enrollDone = 0;\n        readyToSend = false;'
                           '\n        sending = false;\n        updateScanButtons();') + s[j:]
          else:
              print('WARN: หา onBnRegister ไม่เจอ')

          io.open(p, 'w', encoding='utf-8').write(s)
          print('ตัวนับ patched')
          PYEOF7

          # 2e) v17: แก้ข้อความอังกฤษของ demo เดิม
          python3 - "$M" << 'PYEOF6'
          import sys, io
          p = sys.argv[1]
          s = io.open(p, encoding='utf-8', errors='replace').read()
          for a, b in [
              ('"Please input your user id"',
               '"ยังไม่ได้เลือกคนไข้ - ค้นหาด้านบนก่อน"'),
              ('"Please start capture first"',
               '"กด Start เปิดเครื่องสแกนก่อน"'),
              ('"the same finger, please press other finger"',
               '"นิ้วเดิม - แตะนิ้วเดียวกันอีกครั้ง"'),
              ('"enroll succ"', '"เก็บลายนิ้วมือสำเร็จ"'),
              ('"enroll fail"', '"เก็บไม่สำเร็จ - ลองใหม่"'),
          ]:
              s = s.replace(a, b)
          io.open(p, 'w', encoding='utf-8').write(s)
          print('ข้อความไทย patched')
          PYEOF6

          # 2i) v32: Register ใช้ได้ทั้งหน้าเก็บปกติและหน้าเก็บด่วน + แปลอังกฤษให้หมด
          python3 - "$M" << 'PYEOFA'
          import sys, io, re
          p = sys.argv[1]
          s = io.open(p, encoding='utf-8', errors='replace').read()
          ok = 0

          # หน้าเก็บด่วนไม่มีช่องสแกน -> ใช้ id ชั่วคราว ไม่ต้องบังคับ
          old = ('strUid = editText.getText().toString();\n'
                 '            if (null == strUid || strUid.isEmpty()) {\n'
                 '                textView.setText("ยังไม่ได้เลือกคนไข้ - ค้นหาด้านบนก่อน");\n'
                 '                bRegister = false;\n'
                 '                return;\n'
                 '            }')
          new = ('strUid = editText.getText().toString();\n'
                 '            if (quickMode) {\n'
                 '                strUid = "Q_TMP";            // เก็บด่วน - ยังไม่รู้ช่อง ค่อยบันทึกตอนส่ง PC\n'
                 '            } else if (null == strUid || strUid.isEmpty()) {\n'
                 '                textView.setText("ยังไม่ได้เลือกคนไข้ - ค้นหาด้านบนก่อน");\n'
                 '                bRegister = false;\n'
                 '                return;\n'
                 '            }')
