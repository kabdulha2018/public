              }

              public void onBnConvertTest(View view) {
                  if (lastTemplateRaw == null) {
                      setResult("ยังไม่มี template - กด Register แตะนิ้ว 3 ครั้งก่อน");
                      return;
                  }
                  StringBuilder sb = new StringBuilder();
                  try {
                      byte[] in = lastTemplateRaw;
                      sb.append("ก่อนแปลง: ").append(hex8(in, lastTemplateLen))
                        .append("\\n= ").append(guessFormat(in))
                        .append(" (").append(lastTemplateLen).append(" ไบต์)\\n\\n");

                      byte[] out = new byte[4096];
                      int ret = ZKFingerService.convertTemplate(in, out);
                      sb.append("convertTemplate คืนค่า = ").append(ret).append("\\n");
                      if (ret > 0) {
                          sb.append("หลังแปลง: ").append(hex8(out, ret))
                            .append("\\n= ").append(guessFormat(out))
                            .append(" (").append(ret).append(" ไบต์)");
                          String b64 = Base64.encodeToString(out, 0, ret, Base64.NO_WRAP);
                          lastConvertedB64 = b64;
                          sb.append("\\n\\n(คัดลอกผลแล้ว - กดปุ่มคัดลอกเพื่อวางที่ PC)");
                          try {
                              android.content.ClipboardManager cm =
                                  (android.content.ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                              cm.setPrimaryClip(android.content.ClipData.newPlainText("iso_template", b64));
                          } catch (Exception ig) { }
                      } else {
                          sb.append("แปลงไม่สำเร็จ (ค่าติดลบ/ศูนย์ = SDK ไม่รองรับ หรือต้องตั้งค่าก่อน)");
                      }
                  } catch (Throwable t) {
                      sb.append("\\nError: ").append(t.toString());
                  }
                  setResult(sb.toString());
              }

