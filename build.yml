              /** ขอลิงก์ hn-photo จาก PC (รหัส Cloudflare อยู่ที่ PC ไม่ออกมาที่มือถือ) */
              /**
               * เปิด hn-photo - v28: เปิดตรงกับ worker ไม่ต้องผ่าน PC
               * (ถ้า worker ล่ม ค่อยขอลิงก์จาก PC เป็นทางสำรอง)
               */
              public void onBnPhoto(View view) {
                  final String wk = cfgWorker();
                  final String pin = cfgPin();
                  final String sec = cfgSecret();
                  if (pin.length() == 0 || sec.length() == 0) {
                      setResult("ยังไม่ได้ตั้งค่าเครื่อง"); return;
                  }
                  if (wk.length() > 0) {
                      try {
                          String u = "https://" + wk + "/appopen?secret="
                                   + java.net.URLEncoder.encode(sec, "UTF-8")
                                   + "&pin=" + java.net.URLEncoder.encode(pin, "UTF-8")
                                   + "&to=" + java.net.URLEncoder.encode("/cam", "UTF-8");
                          openUrl(u);
                          setResult("");
                          return;
                      } catch (Exception e) { }
                  }
                  // สำรอง: ขอลิงก์จาก PC
                  final String host = cfgHost();
                  if (host.length() == 0) { setResult("เปิดไม่ได้ - ยังไม่ได้ตั้งที่อยู่เว็บ"); return; }
                  setResult("กำลังเปิด...");
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              org.json.JSONObject o = new org.json.JSONObject();
                              o.put("pin", pin);
                              o.put("secret", sec);
                              o.put("dev", "phone");
                              o.put("to", "/cam");
                              String body = httpPost(host, "/photolink", o.toString());
                              org.json.JSONObject j = new org.json.JSONObject(body);
                              if (!j.optBoolean("ok", false)) {
                                  setResult("เปิดไม่ได้: " + j.optString("err", body));
                                  return;
                              }
                              final String u = j.optString("url", "");
                              runOnUiThread(new Runnable() {
                                  @Override
                                  public void run() { openUrl(u); setResult(""); }
                              });
                          } catch (Exception e) {
                              setResult("เปิดไม่ได้: " + e.getMessage());
                          }
                      }
                  }).start();
              }

              /** เลือกนิ้วที่จะเก็บ */
              public void onBnFinger(View view) {
                  try {
                      int vid = view.getId();
                      final String want = (vid == R.id.fR2 || vid == R.id.qR2) ? "R2" : "R1";
                      if (want.equals(curFinger)) { return; }

                      // เก็บด่วน: เปลี่ยนนิ้วได้เลย ลายนิ้วมือที่เก็บไว้ไม่หาย
                      if (quickMode) {
                          curFinger = want;
                          if (!curFinger.equals(unlockedFinger)) { unlockedFinger = ""; }
                          updateFingerRow();
                          updateScanButtons();
                          setResult(readyToSend
                              ? ("จะบันทึกเป็น " + fingerName(curFinger)
                                 + "\\nลายนิ้วมือที่เก็บไว้ไม่หาย - กด เก็บด่วน ได้เลย")
                              : ("เลือก " + fingerName(curFinger) + " แล้วกด Register"));
                          return;
                      }

                      // โหมดปกติ: ถ้าเก็บไว้แล้วต้องเตือนก่อน เพราะช่องสแกนผูกกับนิ้ว
                      if (readyToSend || enrollDone > 0) {
                          new android.app.AlertDialog.Builder(MainActivity.this)
                              .setTitle("เปลี่ยนนิ้ว")
                              .setMessage("ลายนิ้วมือที่เพิ่งเก็บจะหายไป\\nต้องแตะใหม่ 3 ครั้ง")
                              .setNegativeButton("ไม่เปลี่ยน", new android.content.DialogInterface.OnClickListener() {
                                  @Override
                                  public void onClick(android.content.DialogInterface d, int w) {
                                      updateFingerRow();     // ติ๊กกลับที่เดิม
                                  }
                              })
                              .setPositiveButton("เปลี่ยน", new android.content.DialogInterface.OnClickListener() {
                                  @Override
                                  public void onClick(android.content.DialogInterface d, int w) {
                                      curFinger = want;
                                      unlockedFinger = "";
                                      updateFingerRow();
                                      resetScanButtons();
                                      updateScanButtons();
                                      askSid();
                                  }
                              }).show();
                          return;
                      }

                      curFinger = want;
                      if (!curFinger.equals(unlockedFinger)) { unlockedFinger = ""; }
                      updateFingerRow();           // ติ๊กให้ถูกช่อง (จัดการเอง ไม่ใช้ RadioGroup)
                      resetScanButtons();          // เริ่มนิ้วใหม่ - เปิดปุ่ม B ปิดปุ่ม C
                      updateScanButtons();
                      if (curRid > 0 || curUid.length() > 0) {
                          askSid();                // ขอสถานะใหม่ (มีนิ้วไหนแล้ว/ยังขาดอะไร)
                      } else {
                          setResult("เลือกนิ้ว: " + fingerName(curFinger) + "\\nเลือกคนไข้ก่อน");
                      }
                  } catch (Throwable t) { }
              }

